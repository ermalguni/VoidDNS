name: voiddns
arch: ${PACKAGE_ARCH}
platform: linux
version: ${VERSION}
release: 1
section: net
priority: optional
maintainer: Ermal Guni
description: DNS caching forwarder with in-memory filtering, a management API, and a local web UI
homepage: ${PROJECT_URL}
license: MIT
depends:
  - ca-certificates
scripts:
  postinstall: packaging/scripts/deb-postinstall
  preremove: packaging/scripts/deb-preremove
  postremove: packaging/scripts/postremove
overrides:
  deb:
    depends:
      - ca-certificates
      - passwd
      - init-system-helpers
  rpm:
    depends:
      - ca-certificates
      - shadow-utils
    scripts:
      postinstall: packaging/scripts/rpm-postinstall
      preremove: packaging/scripts/rpm-preremove
  archlinux:
    depends:
      - ca-certificates
      - shadow
    scripts:
      postinstall: packaging/scripts/arch-postinstall
      preremove: packaging/scripts/arch-preremove
archlinux:
  scripts:
    postupgrade: packaging/scripts/arch-postupgrade
contents:
  - src: zig-out/bin/VoidDNS
    dst: /usr/bin/VoidDNS
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/licenses/voiddns/LICENSE
  - src: README.md
    dst: /usr/share/doc/voiddns/README.md
  - src: examples/voiddns.json
    dst: /usr/share/doc/voiddns/examples/voiddns.json
  - src: examples/blocked-domains.txt
    dst: /usr/share/doc/voiddns/examples/blocked-domains.txt
  - src: packaging/voiddns.service
    dst: /usr/lib/systemd/system/voiddns.service
    file_info:
      mode: 0644
  - src: packaging/scripts/package-setup
    dst: /usr/lib/voiddns/package-setup
    file_info:
      mode: 0755
