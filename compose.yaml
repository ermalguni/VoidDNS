services:
  voiddns:
    image: ${VOIDDNS_IMAGE:?Set VOIDDNS_IMAGE to a versioned VoidDNS image or digest}
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "53:5353/udp"
    volumes:
      - type: bind
        source: ./examples
        target: /config
        bind:
          create_host_path: false
    command: ["--config", "/config/voiddns.json"]
  ui:
    image: ${VOIDDNS_UI_IMAGE:?Set VOIDDNS_UI_IMAGE to the matching versioned VoidDNS UI image or digest}
    init: true
    restart: unless-stopped
    depends_on:
      - voiddns
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8081:8081"
